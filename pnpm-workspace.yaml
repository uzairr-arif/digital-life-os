packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # esbuild's postinstall validates/downloads its platform binary - trusted.
  esbuild: true
  # electron's postinstall downloads the runtime binary for the local platform.
  electron: true
  # its postinstall only serves the Squirrel target we do not use.
  electron-winstaller: false

# Security: vitest pins vite 6.x; force the patched line (>=6.4.4, see GHSA-9jrq-w75r-8gcw).
overrides:
  vite: ^6.4.4
  # GHSA globparts amplification: the vulnerable copy sits under electron-builder
  "@electron/universal>minimatch": "^11.0.1"
  "app-builder-lib>minimatch": "^11.0.1"
